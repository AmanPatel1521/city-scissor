<!DOCTYPE html>

    <!-- Preload Critical LCP Intro Images with High Priority -->
    <link rel="preload" as="image" type="image/webp" href="/images/Ahmedabad_City_Mobile_720.webp" media="(max-width: 767px)" fetchpriority="high" />
    <link rel="preload" as="image" type="image/webp" href="/images/Ahmedabad_City.webp" media="(min-width: 768px)" fetchpriority="high" />

    <!-- Streamlined Google Fonts: Non-render-blocking with swap display -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Cormorant+Garamond:ital,wght@0,400;1,400;1,600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Cormorant+Garamond:ital,wght@0,400;1,400;1,600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" media="print" onload="this.media='all'" />

    </noscript>

    <style>
      /* Critical inline styles for instantaneous First Contentful Paint */
      html, body {
        background-color: #070709;
        color: #F8F8FA;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow-x: hidden;
      }
    </style>

    <script>
      window.__EARLY_OPEN__ = false;
      function handleEarlyOpen() {
        window.__EARLY_OPEN__ = true;
        var el = document.getElementById('initial-prehero');
        if (el) el.style.opacity = '0';
      }
    </script>
  </head>
  <body class="bg-[#070709] text-[#F8F8FA] antialiased selection:bg-[#D4AF37] selection:text-black">
    <div id="root">
      <div
        id="initial-prehero"
        onclick="handleEarlyOpen()"
        class="fixed inset-0 z-50 h-[100svh] w-screen overflow-hidden select-none bg-[#070709] cursor-pointer"
        style="position: fixed; inset: 0; width: 100vw; height: 100svh; background-color: #070709; overflow: hidden; z-index: 50; transition: opacity 0.7s ease-out;"
      >
        <!-- Splitting Left Curtain Wing -->
        <div
          style="position: absolute; inset: 0; width: 100%; height: 100%; clip-path: polygon(0 0, 50% 0, 50% 100%, 0 100%); overflow: hidden;"
        >
          <picture style="position: absolute; inset: 0; width: 100%; height: 100%;">
            <source media="(max-width: 767px)" type="image/webp" srcset="/images/Ahmedabad_City_Mobile_720.webp" />
            <source media="(max-width: 767px)" type="image/jpeg" srcset="/images/Ahmedabad_City_Mobile.jpg" />
            <source type="image/webp" srcset="/images/Ahmedabad_City.webp" />
            <img
              src="/images/Ahmedabad_City.jpg"
              alt="Ahmedabad City"
              fetchpriority="high"
              decoding="async"
              style="width: 100%; height: 100%; object-fit: cover; object-position: center;"
            />
          </picture>
          <div style="position: absolute; inset: 0; background: linear-gradient(to right, rgba(0,0,0,0.4), rgba(0,0,0,0.15), transparent);"></div>
          <div style="position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; transform: translateX(-100%); background: linear-gradient(to bottom, transparent, #D4AF37, transparent); box-shadow: 0 0 25px #D4AF37;"></div>
        </div>

        <!-- Splitting Right Curtain Wing -->
        <div
          style="position: absolute; inset: 0; width: 100%; height: 100%; clip-path: polygon(50% 0, 100% 0, 100% 100%, 50% 100%); overflow: hidden;"
        >
          <picture style="position: absolute; inset: 0; width: 100%; height: 100%;">
            <source media="(max-width: 767px)" type="image/webp" srcset="/images/Ahmedabad_City_Mobile_720.webp" />
            <source media="(max-width: 767px)" type="image/jpeg" srcset="/images/Ahmedabad_City_Mobile.jpg" />
            <source type="image/webp" srcset="/images/Ahmedabad_City.webp" />
            <img
              src="/images/Ahmedabad_City.jpg"
              alt="Ahmedabad City"
              fetchpriority="high"
              decoding="async"
              style="width: 100%; height: 100%; object-fit: cover; object-position: center;"
            />
          </picture>
          <div style="position: absolute; inset: 0; background: linear-gradient(to left, rgba(0,0,0,0.4), rgba(0,0,0,0.15), transparent);"></div>
          <div style="position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: linear-gradient(to bottom, transparent, #D4AF37, transparent); box-shadow: 0 0 25px #D4AF37;"></div>
        </div>

        <!-- Center Laser Line -->
        <div style="position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; transform: translateX(-50%); background: linear-gradient(180deg, transparent, #F4E295, #D4AF37, transparent); box-shadow: 0 0 30px #D4AF37, 0 0 60px #F4E295; pointer-events: none;"></div>

        <!-- Editorial City Scissor Intro Title -->
        <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-top: 7rem; text-align: center; pointer-events: none; z-index: 30; padding-left: 1rem; padding-right: 1rem;">
          <div style="position: relative; padding: 0.75rem 1rem; border-radius: 1.5rem; display: flex; flex-direction: column; align-items: center; max-width: 95vw;">
            <div style="position: absolute; inset: 0; border-radius: 1.5rem; background: radial-gradient(ellipse at center, rgba(7,7,9,0.85) 0%, rgba(7,7,9,0.5) 55%, transparent 80%); filter: blur(10px); z-index: -1;"></div>
            <h1 style="font-family: 'Cinzel', Georgia, serif; font-size: clamp(2rem, 8vw, 6rem); font-weight: 900; letter-spacing: 0.1em; color: #ffffff; margin: 0; text-shadow: 0 10px 35px rgba(0,0,0,1);">
              CITY <span style="background: linear-gradient(135deg, #FFF6D1 0%, #D4AF37 50%, #9A7B20 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">SCISSOR</span>
            </h1>
            <p style="margin-top: 0.75rem; font-size: clamp(9px, 2.5vw, 14px); text-transform: uppercase; letter-spacing: 0.2em; color: #E6CA65; font-family: monospace; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
              <span style="display: inline-block; width: 2rem; height: 1px; background: linear-gradient(to right, transparent, #D4AF37);"></span>
              <span>Luxury Unisex Salon • Ambawadi</span>
              <span style="display: inline-block; width: 2rem; height: 1px; background: linear-gradient(to left, transparent, #D4AF37);"></span>
            </p>
          </div>
        </div>

        <!-- Bottom Control -->
        <div style="position: absolute; bottom: 2rem; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 0.75rem; z-index: 30; width: 100%; padding: 0 1.5rem; max-width: 24rem;">
          <div style="width: 16rem; height: 0.5rem; background: #171722; border-radius: 9999px; overflow: hidden; border: 1px solid rgba(212,175,55,0.4); box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);">
            <div style="height: 100%; width: 6%; background: linear-gradient(to right, #D4AF37, #F4E295, #D4AF37); border-radius: 9999px;"></div>
          </div>
          <button style="width: 100%; max-width: 260px; height: 46px; border-radius: 9999px; background: linear-gradient(135deg, #F4E295 0%, #D4AF37 50%, #B8860B 100%); color: #000; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; border: none; cursor: pointer; box-shadow: 0 0 40px rgba(212,175,55,0.5); display: flex; align-items: center; justify-content: center; gap: 0.75rem;">
            <span>ENTER SALON</span>

          <p style="margin: 0; font-size: 11px; color: rgba(230,202,101,0.8); letter-spacing: 0.2em; text-transform: uppercase; font-family: monospace;">

          </p>
